<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Argus — AI Visibility Monitor (POC · single-model)</title>
<style>
:root{--bg:#0a0f16;--panel:#101722;--panel2:#0c1320;--line:#1c2938;--line2:#24344a;--txt:#e8eef7;--mut:#8ba1bb;--dim:#5a7189;--acc:#2dd4a7;--accbg:rgba(45,212,167,.12);--blue:#38bdf8;--amber:#f2b04c;--rose:#f2708a;--vio:#a78bfa;--c0:#141d2a;--c1:#a87f33;--c2:#2dd4a7;--c3:#8bf2cf}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;overflow:hidden}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
#fatal{display:none;position:fixed;left:0;right:0;top:0;z-index:99;background:#3b0d18;color:#ffb3c0;padding:10px 16px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;border-bottom:2px solid #f2708a}
#side{width:238px;min-width:238px;background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .2s,min-width .2s}
/* M7.5 rail collapse: icons only, still fully usable. The width transition is
   200ms — inside the 150–250ms band §11 freezes, so it does not read as a
   different product state. */
#side.rail{width:64px;min-width:64px}
.logo{padding:18px 16px 10px;border-bottom:1px solid var(--line)}
.logo h1{font-size:17px;letter-spacing:.18em;color:var(--acc)}
.logo .sub{color:var(--dim);font-size:10.5px;letter-spacing:.14em;margin-top:2px}
nav{flex:1;overflow:auto;padding:8px}
/* The group header is a real control: it collapses. It was a static label until
   M7.5, which meant a long nav could not be shortened without the rail. */
.ng{display:flex;align-items:center;gap:5px;width:100%;background:transparent;border:0;font:inherit;font-size:10px;letter-spacing:.16em;color:var(--dim);padding:14px 10px 4px;cursor:pointer;text-align:left}
.ng:hover{color:var(--mut)}
.ng .chev{font-size:8px;width:8px;display:inline-block}
.rail .ng{justify-content:center;padding:14px 0 4px}
.rail .ng .gtx{display:none}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--mut);cursor:pointer;font-weight:500;font-size:13.5px}
.ni:hover{background:#131d2c;color:var(--txt)}
.ni.on{background:var(--accbg);color:var(--acc)}
.ni .ico{width:14px;text-align:center;flex:none}
.rail .ni{justify-content:center;padding:8px 0}
.rail .ni .lbl{display:none}
.ni:focus-visible,.ng:focus-visible,.railbtn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.nb{margin-left:auto;background:var(--rose);color:#fff;font-size:10px;padding:1px 7px;border-radius:99px;font-weight:700}
.railbtn{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;border-top:1px solid var(--line);color:var(--dim);font:inherit;font-size:11.5px;padding:11px 16px;cursor:pointer;text-align:left}
.railbtn:hover{color:var(--txt)}
.rail .railbtn{justify-content:center;padding:11px 0}
.rail .railbtn .lbl{display:none}
#wrap{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:58px;min-height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;background:var(--panel2)}
.hat{display:flex;background:#0a111c;border:1px solid var(--line2);border-radius:9px;padding:3px}
.hat button{border:0;background:transparent;color:var(--mut);padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px}
.hat button.on{background:var(--acc);color:#04231a}
.hat button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* M7.5 — the brand chip is READ-ONLY and carries a lock. The old topbar had a
   target <select> here, which advertised a choice the workspace deliberately
   does not offer and had to enumerate every registered brand to render. */
.brandchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--mut);cursor:help}
.brandchip b{color:var(--txt);font-weight:600}
.brandchip .lk{opacity:.75}
/* M7.5 — lineage moved OUT of the topbar into a footer strip. The topbar is now
   exactly: brand chip · hat · Tour · Reset. The strip is hidden in print,
   because a report that reaches paper with the console's chrome on it is a report
   somebody has to clean up. */
#foot{border-top:1px solid var(--line);background:var(--panel2);padding:7px 22px;font-size:10.5px;color:var(--dim);display:flex;gap:18px;flex-wrap:wrap;align-items:center}
#foot .k{color:#3f5468;letter-spacing:.12em}
/* M7.5 — one PageHeader shape for every screen: title, one-line subtitle, and a
   lineage chip row. Absent values are OMITTED rather than rendered blank — a
   chip reading "geo —" implies a value exists and is missing. */
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.phead h2{margin-bottom:4px}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.pchip{font-size:10px;letter-spacing:.06em;padding:3px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--mut)}
.pchip .pk{color:var(--dim)}
.oper-lock{max-width:640px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:20px}
.oper-lock input{letter-spacing:.06em}
.footbtn{border:1px solid var(--line2);background:transparent;color:var(--txt);border-radius:8px;padding:7px 13px;font:inherit;font-size:12.5px;cursor:pointer}
.footbtn:hover{border-color:var(--acc);color:var(--acc)}
.footbtn[disabled]{opacity:.4;cursor:not-allowed}
#main{flex:1;overflow:auto;padding:26px 30px}
h2{font-size:19px;margin-bottom:4px}
h3{font-size:15px;margin:18px 0 6px}
.lead{color:var(--mut);font-size:13px;margin-bottom:20px;max-width:860px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mt{margin-top:16px}.mt8{margin-top:8px}.mt24{margin-top:24px}
.lbl{font-size:10.5px;letter-spacing:.13em;color:var(--dim);margin-bottom:8px}
.big{font-size:32px;font-weight:700}
.tile{cursor:pointer;transition:border-color .15s}
.tile:hover{border-color:var(--acc)}
.pos{color:var(--acc)}.neg{color:var(--rose)}.mut{color:var(--mut)}.dimc{color:var(--dim)}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:99px}
.b-new{background:rgba(242,176,76,.15);color:var(--amber)}
.b-true{background:rgba(45,212,167,.15);color:var(--acc)}
.b-false{background:rgba(242,112,138,.15);color:var(--rose)}
.b-unk{background:rgba(139,161,187,.15);color:var(--mut)}
.b-op{background:rgba(139,161,187,.10);color:var(--dim)}
.b-ro{background:rgba(167,139,250,.15);color:var(--vio)}
.b-pf{background:rgba(56,189,248,.15);color:var(--blue)}
.b-ex{background:rgba(242,176,76,.12);color:var(--amber);border:1px dashed rgba(242,176,76,.4)}
.b-res{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.btn{border:0;border-radius:9px;padding:10px 18px;font-weight:700;font-size:13.5px;cursor:pointer;background:var(--acc);color:#04231a}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt)}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:7px}
.btn.danger{background:transparent;border:1px solid var(--line2);color:var(--rose)}
.btn.danger:hover{border-color:var(--rose)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.1em;color:var(--dim);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.015)}
.bar{height:8px;border-radius:99px;background:var(--c0);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.amber i{background:var(--amber)}
.mcell{width:14px;height:14px;border-radius:3px;display:inline-block;margin:1px;cursor:pointer}
.t0{background:var(--c0)}.t1{background:var(--c1)}.t2{background:var(--c2)}.t3{background:var(--c3)}
.mcell:hover{outline:2px solid #fff}
.mrow{display:flex;align-items:center;gap:8px;padding:3px 0}
.mname{width:340px;min-width:340px;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:16px;font-size:11px;color:var(--mut);margin:10px 0}
.legend span{display:flex;align-items:center;gap:6px}
.qbox{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:13px;font-style:italic}
.qmeta{font-size:10.5px;color:var(--dim);font-style:normal;margin-top:4px;letter-spacing:.05em}
.claim{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s}
.claim:hover{border-color:var(--acc)}
.claim .txt{font-weight:600;font-size:14px;margin:8px 0 6px}
.claim .snip{color:var(--mut);font-size:12.5px;font-style:italic}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.fchip{border:1px solid var(--line2);background:transparent;color:var(--mut);border-radius:99px;padding:5px 13px;font-size:12px;cursor:pointer;font-weight:600}
.fchip.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.vbtns{display:flex;gap:10px;margin:12px 0}
.vbtn{flex:1;border:1px solid var(--line2);background:transparent;border-radius:9px;padding:12px;font-weight:700;cursor:pointer;color:var(--mut);font-size:14px}
.vbtn.on-true{background:rgba(45,212,167,.15);border-color:var(--acc);color:var(--acc)}
.vbtn.on-false{background:rgba(242,112,138,.15);border-color:var(--rose);color:var(--rose)}
.vbtn.on-unknown{background:rgba(139,161,187,.15);border-color:var(--mut);color:var(--txt)}
textarea,input[type=text],select{width:100%;background:#0a111c;border:1px solid var(--line2);border-radius:8px;color:var(--txt);padding:9px 12px;font:inherit;font-size:13px}
textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
#modal{position:fixed;inset:0;display:none;z-index:50}
#modal.open{display:block}
.mback{position:absolute;inset:0;background:rgba(4,8,14,.72);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto}
.mcard{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px;max-width:820px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#toasts{position:fixed;right:20px;bottom:86px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:#0d1a17;border:1px solid var(--acc);color:var(--acc);padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.warn{border-color:var(--amber);color:var(--amber)}
.step{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;min-width:150px;flex:1}
.step:hover{border-color:var(--acc)}
.step .n{font-size:10px;color:var(--dim);letter-spacing:.14em}
.step .t{font-weight:700}
.step .d{font-size:11.5px;color:var(--mut)}
.arrow{align-self:center;color:var(--dim);font-size:18px}
.banner{background:rgba(242,176,76,.08);border:1px solid rgba(242,176,76,.35);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--amber);margin-bottom:18px}
.note{font-size:11.5px;color:var(--dim);line-height:1.6}
.ok{color:var(--acc)}.warn{color:var(--amber)}.err{color:var(--rose)}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.pcard .em{font-size:22px}
.lint{font-size:12px;margin-top:8px;min-height:18px}
.logbox{background:#070b12;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:11px;color:var(--dim);height:130px;overflow:auto;line-height:1.7}
.pgmeter{font-size:11px;color:var(--dim);margin:6px 0}
.chatwrap{display:grid;grid-template-columns:290px 1fr;gap:16px;height:calc(100vh - 190px);min-height:420px}
.chatleft{overflow:auto;padding-right:4px}
.chipq{display:block;width:100%;text-align:left;margin:6px 0;border:1px solid var(--line2);background:transparent;color:var(--mut);border-radius:10px;padding:9px 12px;font-size:12.5px;cursor:pointer}
.chipq:hover{border-color:var(--acc);color:var(--txt)}
.chatmain{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
#chatthread{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.55}
.msg.you{align-self:flex-end;background:var(--accbg);border:1px solid rgba(45,212,167,.3)}
.msg.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.msg .btn{margin:8px 6px 0 0}
.chatinrow{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}
.chatinrow input{flex:1}
#fab{position:fixed;right:22px;bottom:22px;z-index:120;width:52px;height:52px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);font-size:22px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
#fab:hover{border-color:var(--acc)}
.tcard{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:min(640px,94vw);background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:14px 18px;z-index:300;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.tour-hi{outline:2px solid var(--acc);outline-offset:3px;border-radius:12px;animation:tpulse 1.6s infinite}
@keyframes tpulse{50%{box-shadow:0 0 0 10px rgba(45,212,167,.08)}}
@media print{#side,#topbar,#foot,.no-print,#toasts,#fatal,#fab,#tourbox{display:none!important}body{background:#fff;color:#000;overflow:visible;display:block}#wrap{display:block}#main{overflow:visible;padding:0}.card{border-color:#bbb;background:#fff;color:#000}.big,.pos,.neg{color:#000}.badge{border:1px solid #999;color:#000;background:#fff}.qbox{background:#f5f5f5;color:#000;border-color:#999}.note,.dimc,.mut,.lead{color:#333}.pchip{border-color:#ccc;color:#333}}
</style>
</head>
<body>
<div id="fatal"></div>
<aside id="side"></aside>
<div id="wrap">
  <header id="topbar"></header>

  <footer id="foot" class="no-print"></footer>
</div>
<div id="modal"></div>
<div id="toasts"></div>
<button id="fab" title="Ask Buddy" onclick="App.nav('chat')">🤖</button>
<div id="tourbox"></div>
<noscript><div style="padding:20px;color:#f2708a">JavaScript is disabled — Argus cannot render.</div></noscript>

/* ============ utils ============ */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmt(x){return Math.round(x)+"%"}
function clone(o){return JSON.parse(JSON.stringify(o))}
function h32(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)/4294967295}
function qbtn(txt){return '<button class="chipq" onclick="App.askq(\''+txt+'\')">'+esc(txt)+"</button>"}
function nbtn(label,screen){return '<button class="btn ghost sm" onclick="App.nav(\''+screen+'\')">'+label+"</button>"}
function hbtn(label){return '<button class="btn sm" onclick="App.hatGo()">'+label+"</button>"}
function svgBars(items,unit){var H=items.length*30+8,out='<svg viewBox="0 0 360 '+H+'" style="width:100%;height:auto">';
 items.forEach(function(it,i){var y=i*30+4;
  out+='<text x="0" y="'+(y+9)+'" font-size="10" fill="#8ba1bb">'+esc(it.label.slice(0,46))+"</text>";
  out+='<rect x="0" y="'+(y+13)+'" width="300" height="9" rx="4.5" fill="#141d2a"/>';
  out+='<rect x="0" y="'+(y+13)+'" width="'+Math.max(2,300*it.v/100)+'" height="9" rx="4.5" fill="'+(it.warn?"#f2b04c":"#2dd4a7")+'"/>';
  out+='<text x="306" y="'+(y+22)+'" font-size="11" fill="#e8eef7" font-family="ui-monospace,monospace">'+it.v+(unit||"%")+"</text>"});
 return out+"</svg>"}
function svgCI(v,lo,hi){function X(x){return 20+(x/100)*320}
 return '<svg viewBox="0 0 360 64" style="width:100%;height:auto">'+
 '<rect x="'+X(lo)+'" y="26" width="'+(X(hi)-X(lo))+'" height="6" rx="3" fill="#2dd4a7" opacity="0.3"/>'+
 '<line x1="'+X(lo)+'" y1="29" x2="'+X(hi)+'" y2="29" stroke="#2dd4a7" stroke-width="2"/>'+
 '<line x1="'+X(lo)+'" y1="20" x2="'+X(lo)+'" y2="38" stroke="#2dd4a7" stroke-width="2"/>'+
 '<line x1="'+X(hi)+'" y1="20" x2="'+X(hi)+'" y2="38" stroke="#2dd4a7" stroke-width="2"/>'+
 '<circle cx="'+X(v)+'" cy="29" r="5" fill="#2dd4a7"/>'+
 '<text x="'+X(v)+'" y="12" font-size="11" fill="#e8eef7" text-anchor="middle" font-family="ui-monospace,monospace">'+fmt(v)+"</text>"+
 '<text x="'+X(lo)+'" y="54" font-size="10" fill="#8ba1bb" text-anchor="middle">'+fmt(lo)+"</text>"+
 '<text x="'+X(hi)+'" y="54" font-size="10" fill="#8ba1bb" text-anchor="middle">'+fmt(hi)+"</text></svg>"}

/* ============ deterministic engine ============ */
function tier(aid,mi,run){var a=Math.min(aid,3);var p=BASE[a]*(TW[a][mi]||1);
 if(h32(aid+"|"+mi+"|"+run)>=p)return 0;
 var r=h32(aid+"|"+mi+"|"+run+"|t");var t=T3R[a];
 return r<t*0.35?3:(r<t?2:1)}
var GRC={};
function grid(aid){if(GRC[aid])return GRC[aid];var g=MISSIONS.map(function(m){var r=[];for(var k=1;k<=RUNS;k++)r.push(tier(aid,m.id,k));return r});GRC[aid]=g;return g}
function rowM(aid,mi){var i=-1;for(var x=0;x<MISSIONS.length;x++)if(MISSIONS[x].id===mi)i=x;var r=grid(aid)[i],n=0;for(var j=0;j<r.length;j++)if(r[j]>0)n++;return n}
function selfAgreement(aid){var g=grid(aid),sum=0;
 g.forEach(function(r){var k=0;r.forEach(function(t){if(t>0)k++});
  var agree=(k*(k-1)+(RUNS-k)*(RUNS-k-1))/2;sum+=agree/45});
 return Math.round(sum/MISSIONS.length*100)}
function agg(aid){var g=grid(aid),c=[0,0,0,0];
 g.forEach(function(row){row.forEach(function(t){c[t]++})});
 var n=MISSIONS.length*RUNS;
 function P(k){var s=0;for(var i=k;i<4;i++)s+=c[i];return s/n}
 var m=P(1),t3=P(2),rc=P(3);
 function ci(p){return 1.96*Math.sqrt(p*(1-p)/n)*100}
 return{m:m*100,t3:t3*100,rec:rc*100,ciM:ci(m),ciT:ci(t3),ciR:ci(rc),n:n,comp:COMPS[Math.min(aid,3)]}}

 if(r>=p)return 0;return h32("P|"+pid+"|"+mi+"|"+run+"|t")<0.55?2:1}

function toast(msg,warn){var t=document.createElement("div");t.className="toast"+(warn?" warn":"");t.textContent=msg;document.getElementById("toasts").appendChild(t);setTimeout(function(){t.remove()},4200)}

 /* audit run (core + probes) */
 run:function(){
  if(S.running)return;S.running=true;
  var aid=latestId()+1,g=grid(aid),cells=[];
  g.forEach(function(row,i){row.forEach(function(t,j){cells.push([i,j,t,false])})});
  S.probes.forEach(function(p,pi){for(var j=0;j<p.runs;j++)cells.push([pi,j,tier(aid,p.id,j),true])});
  var probeCalls=S.probes.reduce(function(a,p){return a+p.runs},0);
  var total=cells.length,k=0,log=document.getElementById("runlog");log.innerHTML="";
  var iv=setInterval(function(){
   for(var x=0;x<4&&k<total;x++,k++){
    var mi=cells[k][0],j=cells[k][1],t=cells[k][2],isP=cells[k][3];
    var el=document.getElementById(isP?("pc_"+S.probes[mi].id):("gc_"+mi+"_"+j));if(el)el.className="mcell t"+t;
    if(k%9===0){
     var mid=isP?S.probes[mi].id:MISSIONS[mi].id;
     var label=isP?("probe "+mid+" · run"+(j+1)):(mid+" · run"+(j+1));
     var latency=Math.round(200+h32(aid+"|"+mid+"|"+j)*1400);
     log.innerHTML+="&gt; "+MODEL.name+" · "+label+" → 200 OK · AgentAnswer ✓ · "+latency+"ms<br>";
     if(h32(aid+"|"+mid+"|"+j)<0.05)log.innerHTML+="&gt; 429 rate-limited → retry 2/3 ✓<br>";
     log.scrollTop=1e6}}
   var p=document.getElementById("pgr");if(p)p.textContent=Math.round(k/total*100)+"%";
   if(k>=total){clearInterval(iv);S.running=false;
    S.audits.push({id:aid,when:"just now",ver:"v1"});S.latest=aid;
    if(aid===3&&!S.a3done){S.a3done=true;CNEW3.forEach(function(c){S.claims.push(clone(c))});
     var c6=null;S.claims.forEach(function(c){if(c.id==="c6")c6=c});if(c6)c6.resolved=true}
    var d=document.getElementById("rundone");if(d)d.innerHTML='<b class="ok">audit #'+aid+" complete.</b>";
    toast("Audit #"+aid+" complete — headline n=120 + "+probeCalls+" probe obs · "+(aid===3?"3 new claims · GF correction now visible":"no new claim types"));
    setTimeout(function(){App.nav("vis")},900)}},26)},
 /* drill-down (core pack only — probes are discovery) */
 drill:function(mk){
  var aid=S.latest,a=agg(aid),g=grid(aid);
  if(mk==="comp"){
   var rows=COMPDISP.map(function(c){return "<tr><td><b>"+esc(c[0])+"</b></td>"+'<td class="mono">'+c[1]+'%</td><td class="mut">'+esc(c[2])+"</td></tr>"}).join("");
   modal('<div class="lbl">COMPETITOR SHARE OF ANSWERS · AUDIT #'+aid+" · "+a.comp+'%</div><table><tr><th>Competitor</th><th>Share</th><th>Displaces us on</th></tr>'+rows+'</table><div class="note mt8">Share of the 120 audited answers in which each competitor appears.</div>');return}
  var map={m:["MENTION RATE",a.m,a.ciM,1],t3:["TOP-3 VISIBILITY",a.t3,a.ciT,2],rec:["RECOMMENDED OUTRIGHT",a.rec,a.ciR,3]};
  var info=map[mk];if(!info)return;
  var rows=MISSIONS.map(function(m,i){var r=g[i],cells="";
   for(var j=0;j<RUNS;j++){var t=r[j],show=(t>=info[3])?t:0;var run=j+1;
    cells+='<span class="mcell t'+show+'" title="'+m.id+" · run"+run+'" onclick="App.cellq(\''+aid+"','"+m.id+"',"+run+","+t+')"></span>'}
   var n=0;for(var jj=0;jj<RUNS;jj++)if(r[jj]>=info[3])n++;
   return '<div class="mrow"><span class="mname" title="'+esc(m.q)+'">'+esc(m.q)+"</span><span>"+cells+"</span>"+'<span class="mono dimc" style="margin-left:8px">'+n+"/"+RUNS+"</span></div>"}).join("");
  modal('<div class="lbl">EVIDENCE — '+info[0]+" · AUDIT #"+aid+" · "+fmt(info[1])+" · 95% CI ±"+info[2].toFixed(1)+" · n="+a.n+" · "+MODEL.name+"</div>"+
  '<div class="legend"><span><i class="mcell t0" style="cursor:default"></i>not mentioned</span><span><i class="mcell t1" style="cursor:default"></i>mentioned</span><span><i class="mcell t2" style="cursor:default"></i>top-3</span><span><i class="mcell t3" style="cursor:default"></i>recommended</span><span class="dimc">click any cell for the verbatim answer</span></div>'+rows)},
 cellq:function(aid,mi,run,t){
  var M=null;MISSIONS.forEach(function(m){if(m.id===mi)M=m});
  var hit=t>0;var txt=hit?HIT[mi]:MISS[mi];
  var label=t===0?"NOT MENTIONED":(t===1?"MENTIONED":(t===2?"TOP-3":"RECOMMENDED"));
  modal('<div class="lbl">VERBATIM TRANSCRIPT · '+label+'</div><div class="qbox">"'+esc(txt)+
  '"<div class="qmeta">'+MODEL.name+" · snapshot "+MODEL.ver+" · run "+run+"/"+RUNS+' · mission: "'+esc(M.q)+'" · audit #'+aid+" · sha256:"+h32(mi+"|"+run).toString(16).slice(0,8)+"…</div></div>"+
  (hit?"":'<div class="note">Absence is also evidence: competitor-heavy answers like this are why the displacement matrix looks the way it does. Same prompt, different run → possibly a different verdict; that variance is the CI.</div>'))},

   return '<div class="qbox">"'+esc(qq.text)+'"<div class="qmeta">'+MODEL.name+" · run "+qq.run+"/"+RUNS+' · mission "'+esc(M?M.q:"exploratory")+"\"</div></div>"}).join("");
  var apiAsk=(c.type==="RETAILER-ONLY"&&c.needs)?'<div class="note mt8" style="border:1px dashed var(--vio);border-radius:8px;padding:8px 12px;color:var(--vio)">To auto-verify this claim we\u2019d need: <b>'+esc(c.needs)+"</b> — that\u2019s the V2 API conversation, itemized.</div>":"";

   modal(tb+"<h2 style='margin-top:10px'>"+esc(c.text)+'</h2><div class="note">observed '+(c.obs||"")+" · first seen audit #"+c.first+"</div>"+quotes+
   '<div class="note mt16">This is an <b>opinion</b> — tagged at extraction, excluded from the review queue by design. It still feeds competitor analysis.</div>');return}
  modal(tb+"<h2 style='margin-top:10px'>"+esc(c.text)+'</h2><div class="note">observed '+(c.obs||"")+" · first seen audit #"+c.first+(c.expl?" · sourced from an EXPLORATORY run":"")+"</div>"+
  '<div class="lbl mt16">VERBATIM EVIDENCE ('+c.quotes.length+")</div>"+quotes+apiAsk+pre+
  '<div class="lbl mt16">RETAILER VERIFICATION</div><div class="vbtns">'+
  '<button class="vbtn '+(S.draftV==="TRUE"?"on-true":"")+'" id="vT" onclick="App.vset(\'TRUE\')">✓ TRUE</button>'+
  '<button class="vbtn '+(S.draftV==="FALSE"?"on-false":"")+'" id="vF" onclick="App.vset(\'FALSE\')">✗ FALSE</button>'+
  '<button class="vbtn '+(S.draftV==="UNKNOWN"?"on-unknown":"")+'" id="vU" onclick="App.vset(\'UNKNOWN\')">? UNKNOWN</button></div>'+
  '<div id="corrWrap" style="display:'+(S.draftV==="FALSE"?"block":"none")+'"><div class="note">Correct the record — what should the market hear instead?</div><textarea id="corr">'+(c.corr?esc(c.corr):"")+"</textarea></div>"+
  '<div class="note mt8">Evidence / comment (optional, becomes provenance)</div><textarea id="vnote">'+(c.note?esc(c.note):"")+"</textarea>"+
  '<div class="row mt16"><button class="btn" onclick="App.vsave(\''+id+'\')">Save verdict</button>'+(c.vat?'<span class="note" style="align-self:center">verified '+esc(c.vat)+"</span>":"")+"</div>")},
 vset:function(v){S.draftV=v;
  var pairs=[["TRUE","vT","on-true"],["FALSE","vF","on-false"],["UNKNOWN","vU","on-unknown"]];

 plint:function(){
  var tp=document.getElementById("pprompt"),np=document.getElementById("pname"),el=document.getElementById("lint");
  if(!tp||!el)return;
  var t=tp.value+(np?np.value:"");var msgs=[];
  if(t.indexOf(RET)>=0)msgs.push('<span class="err">✗ persona must not name the audited retailer ("'+RET+'") — that contaminates the observation. Save blocked.</span>');
  if(t.length<60)msgs.push('<span class="warn">⚠ too short to constrain behaviour — aim for ~80 words across the 5 parts.</span>');
  if(!/never favour|never claim/i.test(t))msgs.push('<span class="warn">⚠ missing the anti-steering / no-AI clauses from the anatomy.</span>');
  if(!msgs.length)msgs.push('<span class="ok">✓ linter clean — no retailer naming, anti-steering present.</span>');
  el.innerHTML=msgs.join("<br>");LINTOK=(t.indexOf(RET)<0)},

 pRun:function(pid){

    renderChrome();toast("new claim candidate added to the review queue")}},24)},
 /* chat */
 ask:function(){var inp=document.getElementById("chatin");var t=(inp&&inp.value||"").trim();if(!t)return;if(inp)inp.value="";App.askq(t)},
 askq:function(t){if(S.screen!=="chat"){S.screen="chat";renderApp()}
  S.chat.push({who:"you",text:esc(t)});renderApp();
  setTimeout(function(){S.chat.push({who:"bot",html:answerFor(t)});renderApp()},450)}
};
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(S.tour.on){App.tourEnd()}else closeModal()}});
/* Restore the navigation preferences. Only the preferences — never the active
   screen, and never anything that would let a stale value stand in for server
   state. */
try{var pr=localStorage.getItem("argus.nav.rail");if(pr==="1")S.rail=true;
 var pg=localStorage.getItem("argus.nav.groups");if(pg)S.collapsed=JSON.parse(pg)||{}}catch(e){}
try{renderApp()}catch(e){var d=document.getElementById("fatal");d.style.display="block";d.textContent="Argus failed to start: "+e.message}
</script>
